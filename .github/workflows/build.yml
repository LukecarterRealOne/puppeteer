name: Build Puppeteer

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Minecraft 1.20.1 mod
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      # Find the Gradle project at the repository root or one folder below it.
      # This also gives a clear error when only the workflow file was committed.
      - name: Locate Gradle project
        id: project
        shell: bash
        run: |
          if [[ -f build.gradle && -f settings.gradle ]]; then
            project_dir="."
          else
            project_dir=""
            while IFS= read -r build_file; do
              candidate="${build_file%/*}"
              [[ "$candidate" == "$build_file" ]] && candidate="."
              if [[ -f "$candidate/settings.gradle" || -f "$candidate/settings.gradle.kts" ]]; then
                project_dir="$candidate"
                break
              fi
            done < <(find . -mindepth 2 -maxdepth 5 -type f \( -name build.gradle -o -name build.gradle.kts \) -not -path '*/build/*' -print)
          fi

          if [[ -z "$project_dir" ]]; then
            echo "::error::Gradle project files were not found. Commit/extract the full Puppeteer project so build.gradle, settings.gradle, gradle.properties, and src/ are in the repository root (not just .github/workflows/build.yml)."
            echo "Repository root contains:"
            ls -la
            exit 1
          fi

          echo "dir=$project_dir" >> "$GITHUB_OUTPUT"
          echo "Using Gradle project directory: $project_dir"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          # Do not set cache: gradle here. setup-gradle below manages Gradle caching.

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Build mod
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle --no-daemon clean build

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: puppeteer-minecraft-1.20.1
          path: |
            ${{ steps.project.outputs.dir }}/build/libs/*.jar
            !${{ steps.project.outputs.dir }}/build/libs/*-sources.jar
            !${{ steps.project.outputs.dir }}/build/libs/*-dev.jar
          if-no-files-found: error
          retention-days: 14
